site_name: SageMaker Fine-tuning & Serving E2E
site_description: Gemma 4를 Amazon SageMaker에서 파인튜닝 → 서빙 → 평가 → agentic loop까지 잇는 한국어 핸즈온
site_url: https://daekeun-ml.github.io/sagemaker-finetune-serve-e2e/
repo_url: https://github.com/daekeun-ml/sagemaker-finetune-serve-e2e
repo_name: daekeun-ml/sagemaker-finetune-serve-e2e
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy      # 코드블록 복사 버튼 (실습에서 자주 씀)
    - content.action.edit
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ko
      # 한국어는 lunr.ko.js(stopword + 한글 trimmer)를 씁니다. 형태소 분석은 아니므로
      # '학습'으로 '학습되므로'가 걸리지 않습니다. 영문 기술 용어(vLLM, LoRA) 검색은 정확합니다.

markdown_extensions:
  - admonition                 # !!! note / warning 박스
  - attr_list
  - def_list
  - md_in_html                 # <details> 안의 마크다운 렌더 (문서에서 사용 중)
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # 기본 slugify는 NFKD로 비ASCII를 전부 버려서 한글 제목이 빈 앵커(#_1, #_2)가 됩니다.
      # pymdownx.slugs.slugify는 유니코드를 보존합니다: '## 비용과 cleanup' → '#비용과-cleanup'.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:      # RUN_E2E.md의 `- [ ]` 체크리스트를 실제 체크박스로 렌더
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 홈: index.md
  - 시작하기: getting_started.md
  # 아래 가이드는 파일명 번호 = 읽는 순서입니다(00 지도 → 01 개념 → 02~06 파이프라인).
  - 가이드:
      - 00 전체 지도: 00_overview.md
      - 01 SageMaker 기초: 01_sagemaker_basics.md
      - 02 합성 데이터: 02_synthetic_data.md
      - 03 파인튜닝: 03_finetuning.md
      - 04 SageMaker 추론: 04_sagemaker_inference.md
      - 05 서빙 컨테이너: 05_serving_containers.md
      - 06 Agentic loop: 06_agentic.md
  # 코스 페이지는 파일명에 번호가 없습니다(가이드 번호와 섞이지 않게). nav 라벨 순서 = 코스 번호 01→05.
  # 파일명 track_*.md는 공개된 URL이라 그대로 둡니다(디렉터리 tracks/와 같은 초기 명칭).
  - 코스:
      - 추출 → JSON: track_extraction.md
      - 분류: track_classification.md
      - 요약: track_summarization.md
      - 도메인 QA: track_domain_qa.md
      - 멀티모달 추출: track_multimodal.md
  - 실행 runbook: RUN_E2E.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/daekeun-ml/sagemaker-finetune-serve-e2e

# 링크가 끊기면 빌드를 실패시킵니다(CI에서 --strict 로 강제).
# 2,300줄 문서에 상호참조가 많아, 문서를 옮길 때 깨진 링크를 배포 전에 잡는 것이 목적입니다.
strict: true

# 파일 링크뿐 아니라 #앵커까지 검증합니다. 섹션 제목을 바꾸면 그 절을 가리키던
# 링크가 조용히 깨지는데, 이 설정이 빌드 단계에서 잡아냅니다.
validation:
  anchors: warn
  unrecognized_links: warn
