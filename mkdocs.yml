site_name: SageMaker AI Fine-tuning & Serving E2E
site_description: Gemma 4를 Amazon SageMaker AI에서 합성 데이터 → 파인튜닝 → 서빙 → 평가 → agentic loop까지 잇는 한국어 핸즈온
site_url: https://daekeun-ml.github.io/sagemaker-finetune-serve-e2e/
repo_url: https://github.com/daekeun-ml/sagemaker-finetune-serve-e2e
repo_name: daekeun-ml/sagemaker-finetune-serve-e2e
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy      # 코드블록 복사 버튼 (실습에서 자주 씀)
    - content.action.edit
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ko
      # 한국어는 lunr.ko.js(stopword + 한글 trimmer)를 씁니다. 형태소 분석은 아니므로
      # '학습'으로 '학습되므로'가 걸리지 않습니다. 영문 기술 용어(vLLM, LoRA) 검색은 정확합니다.

markdown_extensions:
  - admonition                 # !!! note / warning 박스
  - attr_list
  - def_list
  - md_in_html                 # <details> 안의 마크다운 렌더 (문서에서 사용 중)
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # 기본 slugify는 NFKD로 비ASCII를 전부 버려서 한글 제목이 빈 앵커(#_1, #_2)가 됩니다.
      # pymdownx.slugs.slugify는 유니코드를 보존합니다: '## 비용과 cleanup' → '#비용과-cleanup'.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:      # RUN_E2E.md의 `- [ ]` 체크리스트를 실제 체크박스로 렌더
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 홈: index.md
  - 시작하기: getting_started.md
  # 그룹 이름은 '무엇을 담았나'가 아니라 '언제 여는가'로 붙입니다. '가이드' 같은 라벨은
  # 안에 뭐가 있는지 알려주지 않아, 처음 온 사람이 어느 그룹을 열지 못 고릅니다.
  # 파일명 번호(00~06)는 그대로 읽는 순서입니다.
  - 개념부터 이해하기:
      - 00 전체 지도: 00_overview.md
      - 01 SageMaker AI 기초: 01_sagemaker_basics.md
  - 파인튜닝 · 서빙 가이드:
      - 02 합성 데이터: 02_synthetic_data.md
      - 03 파인튜닝: 03_finetuning.md
      - 04 SageMaker AI 추론: 04_sagemaker_inference.md
      - 05 서빙 컨테이너: 05_serving_containers.md
      - 06 Agentic loop: 06_agentic.md
  # 코스 페이지는 파일명에 번호가 없습니다(가이드 번호와 섞이지 않게). nav 라벨 순서 = 코스 번호 01→05.
  # 다섯 페이지는 courses/ 하위에 모여 있고, 폴더명이 옛 track_ 접두어의 역할을 대신합니다
  # (URL도 .../courses/extraction/ 으로 바뀌었습니다).
  - 태스크별 실습 코스:
      - 추출 → JSON: courses/extraction.md
      - 분류: courses/classification.md
      - 요약: courses/summarization.md
      - 도메인 QA: courses/domain_qa.md
      - 멀티모달 추출: courses/multimodal.md
  # 노트북과 파이썬 두 경로를 한 그룹에 묶습니다 — 둘은 '같은 코스를 어떻게 돌리나'의
  # 선택지라, 떨어뜨려 놓으면 하나만 있는 줄 압니다.
  - 직접 실행하기:
      - 노트북으로 완주 (JupyterLab): RUN_E2E.md
      - 스크립트로 실행 (Python): pipelines.md
  # SDK V3는 가이드 번호 체계(00~06, 파이프라인 순서)에 넣지 않습니다. 순서대로 읽는 문서가
  # 아니라 V2 코드를 옮길 때 찾아보는 참조 문서라, 번호를 붙이면 '일곱 번째로 읽는 것'으로 오해됩니다.
  - SageMaker SDK V3:
      - V2에서 바뀐 것: sdk_v3/index.md
      - 학습: sdk_v3/training.md
      - 배포: sdk_v3/serving.md

extra_css:
  - stylesheets/extra.css

extra:
  # 모든 페이지 하단 푸터에 아이콘으로 붙습니다(Material 기본).
  # 🔴 이 리포 링크는 넣지 않습니다 — repo_url 로 이미 우측 상단 헤더에 있고,
  #    푸터에 또 두면 GitHub 아이콘이 두 개가 되어 어느 쪽이 저자 계정인지 구분되지 않습니다.
  #    여기는 저자 프로필만 둡니다.
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/daekeun-kim
      name: 저자 LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/daekeun-ml
      name: 저자 GitHub
    - icon: simple/huggingface
      link: https://huggingface.co/daekeun-ml
      name: 저자 Hugging Face
    - icon: simple/gitbook
      link: https://housekdk.gitbook.io/
      name: 저자 기술 블로그 (GitBook)

# 링크가 끊기면 빌드를 실패시킵니다(CI에서 --strict 로 강제).
# 2,300줄 문서에 상호참조가 많아, 문서를 옮길 때 깨진 링크를 배포 전에 잡는 것이 목적입니다.
strict: true

# 파일 링크뿐 아니라 #앵커까지 검증합니다. 섹션 제목을 바꾸면 그 절을 가리키던
# 링크가 조용히 깨지는데, 이 설정이 빌드 단계에서 잡아냅니다.
validation:
  anchors: warn
  unrecognized_links: warn
