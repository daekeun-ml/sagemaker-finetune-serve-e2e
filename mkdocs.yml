site_name: SageMaker AI Fine-tuning & Serving E2E
site_description: Gemma 4를 Amazon SageMaker AI에서 합성 데이터 → 파인튜닝 → 서빙 → 평가 → agentic loop까지 잇는 한국어 hands-on 가이드
site_url: https://daekeun-ml.github.io/sagemaker-finetune-serve-e2e/
repo_url: https://github.com/daekeun-ml/sagemaker-finetune-serve-e2e
repo_name: daekeun-ml/sagemaker-finetune-serve-e2e
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ko

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # 한글 제목의 앵커를 유지합니다.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 홈: index.md
  - 시작하기: getting_started.md
  - 개념부터 이해하기:
      - 00 전체 지도: concepts/00_overview.md
      - 01 SageMaker AI 기초: concepts/01_sagemaker_basics.md
      - 02 SageMaker AI와 Studio 이해하기: concepts/02_sagemaker_ai_vs_studio.md
      - 03 [Advanced] SageMaker AI 보안과 네트워크: concepts/03_sagemaker_security_network.md
  - 파인튜닝, 서빙 가이드:
      - 01 합성 데이터: guides/01_synthetic_data.md
      - 02 파인튜닝: guides/02_finetuning.md
      - 03 SageMaker AI 추론: guides/03_sagemaker_inference.md
      - 04 서빙 컨테이너: guides/04_serving_containers.md
      - 05 Agentic loop: guides/05_agentic.md
  - 유스케이스별 실습 코스:
      - 추출 → JSON: courses/extraction.md
      - 분류: courses/classification.md
      - 요약: courses/summarization.md
      - 도메인 QA: courses/domain_qa.md
      - 멀티모달 추출: courses/multimodal.md
  - 노트북과 Python 파이프라인 실행:
      - 노트북 실행법: execution/run_notebook.md
      - Python 스크립트 실행법: execution/run_pipeline.md
  - 실험 관리와 측정:
      - 실험 추적 (SageMaker Managed MLflow): experiments/mlflow.md
      - 속도 측정 (TTFT, TPOT, ITL): experiments/benchmark.md
  - SageMaker SDK V3:
      - V2에서 바뀐 것: sdk_v3/index.md
      - 학습: sdk_v3/training.md
      - 배포: sdk_v3/serving.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/daekeun-kim
      name: 저자 LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/daekeun-ml
      name: 저자 GitHub
    - icon: simple/huggingface
      link: https://huggingface.co/daekeun-ml
      name: 저자 Hugging Face
    - icon: simple/gitbook
      link: https://housekdk.gitbook.io/
      name: 저자 기술 블로그 (GitBook)

strict: true

validation:
  anchors: warn
  unrecognized_links: warn
