site_name: SageMaker AI Fine-tuning & Serving E2E
site_description: Gemma 4를 Amazon SageMaker AI에서 합성 데이터 → 파인튜닝 → 서빙 → 평가 → agentic loop까지 잇는 한국어 hands-on 가이드
site_url: https://daekeun-ml.github.io/sagemaker-finetune-serve-e2e/
repo_url: https://github.com/daekeun-ml/sagemaker-finetune-serve-e2e
repo_name: daekeun-ml/sagemaker-finetune-serve-e2e
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ko

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # 한글 제목의 앵커를 유지합니다.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 홈: index.md
  - 시작하기: getting_started.md
  - 개념부터 이해하기:
      - 00 전체 지도: 00_overview.md
      - 01 SageMaker AI 기초: 01_sagemaker_basics.md
  - 파인튜닝, 서빙 가이드:
      - 02 합성 데이터: 02_synthetic_data.md
      - 03 파인튜닝: 03_finetuning.md
      - 04 SageMaker AI 추론: 04_sagemaker_inference.md
      - 05 서빙 컨테이너: 05_serving_containers.md
      - 06 Agentic loop: 06_agentic.md
  - 유스케이스별 실습 코스:
      - 추출 → JSON: courses/extraction.md
      - 분류: courses/classification.md
      - 요약: courses/summarization.md
      - 도메인 QA: courses/domain_qa.md
      - 멀티모달 추출: courses/multimodal.md
  - 직접 실행하기:
      - 노트북으로 완주 (JupyterLab): RUN_E2E.md
      - 스크립트로 실행 (Python): pipelines.md
  - 실험 관리와 측정:
      - 실험 추적 (SageMaker Managed MLflow): mlflow.md
      - 속도 측정 (TTFT, TPOT, ITL): benchmark.md
  - SageMaker SDK V3:
      - V2에서 바뀐 것: sdk_v3/index.md
      - 학습: sdk_v3/training.md
      - 배포: sdk_v3/serving.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/daekeun-kim
      name: 저자 LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/daekeun-ml
      name: 저자 GitHub
    - icon: simple/huggingface
      link: https://huggingface.co/daekeun-ml
      name: 저자 Hugging Face
    - icon: simple/gitbook
      link: https://housekdk.gitbook.io/
      name: 저자 기술 블로그 (GitBook)

strict: true

validation:
  anchors: warn
  unrecognized_links: warn
