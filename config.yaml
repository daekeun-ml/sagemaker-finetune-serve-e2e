# =============================================================================
# pipelines 실행 설정. 이 파일은 커밋됩니다.
# =============================================================================
# `python pipelines/run_<course>.py`가 읽습니다. `pipelines/_config.py`가 값을 환경변수로
# 옮긴 뒤 `common/config.py`를 다시 불러오므로 노트북과 CLI가 같은 설정을 사용합니다.
#
# 우선순위: 셸과 .env의 환경변수 > 이 파일 > common/config.py 기본값
# 한 번만 바꿀 때는 셸에서 지정합니다.
# `TRAIN_INSTANCE_TYPE=ml.g6e.2xlarge python pipelines/run_extraction.py`
#
# 시크릿과 환경 종속 값은 저장하지 않습니다. 아래 키는 이 파일에 있으면 무시됩니다.
# - HF_TOKEN: `hf auth login` 사용
# - SAGEMAKER_ROLE_ARN: 비우면 IAM에서 자동 탐지
# - AWS_REGION: ECR 이미지 URI의 리전과 함께 관리
#
# MLflow 설정도 환경변수로 관리합니다:
# - USE_MLFLOW=1: 켜기. App이 없으면 로컬 SQLite 사용
# - USE_MLFLOW=0: 끄기
# - MLFLOW_APP_NAME: 찾을 App 이름. 기본값은 gemma-e2e
# - MLFLOW_TRACKING_URI: 추적 대상을 직접 지정
# App을 다시 만들면 ARN의 AWS 생성 ID가 바뀔 수 있으므로 ARN은 커밋 파일에 넣지 않습니다.
#
# 이 파일이 없으면 `pipelines/_config.py`의 기본값을 사용합니다.
# =============================================================================

# ---------------------------------------------------------------------------
# 모델
# ---------------------------------------------------------------------------
model:
  # E2B | E4B | 12B | 26B-A4B | 31B  (common/config.py GEMMA4_PRESETS)
  # E4B는 단일 L4 24GB에서 QLoRA가 가능하고 병합 시 32GB 호스트 메모리 안에 들어갑니다.
  # 더 큰 모델은 training.instance_type도 함께 올리세요.
  size: E4B

  # 프리셋 model_id를 바꿀 때만 지정합니다. 비우면 프리셋 값을 사용합니다.
  id: ""

  # gated 모델을 직접 지정할 때만 true로 설정합니다.
  # 이 경우 HF 토큰이 서빙 컨테이너 환경변수에 포함됩니다.
  is_gated: false

# ---------------------------------------------------------------------------
# SFT 학습
# ---------------------------------------------------------------------------
training:
  # g5보다 용량 확보가 쉬운 g6를 사용합니다. GPU는 L4 24GB이며 호스트 메모리는 32GB입니다.
  instance_type: ml.g6.2xlarge

  # 대기, 다운로드, 학습, 병합, 업로드를 모두 포함하는 실행 상한입니다.
  # SDK 기본값 1시간은 병합 전에 끝날 수 있으므로 명시적으로 늘립니다.
  max_runtime_hours: 4

  # 핸즈온 규모. 파이프라인이 끝까지 도는지 보는 것이 목적입니다.
  # 정식 학습은 max_train_samples를 null로 두고 epochs를 3~5로 조정하세요.
  epochs: 2
  max_train_samples: 200        # null = train.jsonl 전량

  # 유효 배치는 8이며 24GB GPU에서 길이 2048의 QLoRA 학습이 가능합니다.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  use_qlora: true               # 4bit NF4와 double quantization
  merge_adapter: true           # false면 adapter만 남아 바로 배포할 수 없습니다

  lora:
    r: 16
    alpha: 16
    dropout: 0.05

  # 예상 시간을 계산할 때 사용하는 기준값입니다.
  # g6.2xlarge 기준: 길이 2048은 약 17초, 512는 약 7초입니다.
  seconds_per_step: 17

  # repository와 tag만 저장하고 URI의 리전은 common/dlc.py가 AWS_REGION으로 조립합니다.
  # 완전한 URI가 필요하면 우선순위가 더 높은 .env의 DLC_IMAGE_URI를 사용하세요.
  dlc:
    repository: pytorch-training
    tag: 2.10.0-gpu-py313-cu130-ubuntu22.04-sagemaker-v1.7   # ECR 실조회 검증

# ---------------------------------------------------------------------------
# GRPO 정련
# ---------------------------------------------------------------------------
grpo:
  # 프롬프트마다 num_generations개를 생성하므로 SFT보다 오래 걸립니다.
  max_runtime_hours: 6

  # holdout | synth | failures
  # holdout은 SFT와 같은 분포라 학습 신호가 약할 수 있어 synth를 기본으로 사용합니다.
  # failures는 배포와 평가 결과가 먼저 필요합니다. 자세한 내용은 common/grpo_data.py를 참고하세요.
  prompt_source: synth
  num_prompts: 100              # rollout 비용이 크므로 작게 시작하세요
  epochs: 1
  learning_rate: 1.0e-5         # SFT보다 낮게 설정합니다
  num_generations: 8            # 그룹 크기. 클수록 신호와 연산이 함께 늘어납니다
  max_completion_length: 256

# ---------------------------------------------------------------------------
# 실시간 엔드포인트
# ---------------------------------------------------------------------------
serving:
  # vllm | sglang | lmi. 모두 messages 스키마를 사용합니다.
  # train.py가 KV-shared 텐서를 복원하므로 E2B와 E4B도 vLLM으로 서빙할 수 있습니다.
  engine: vllm

  # L4 24GB에서 E4B bf16 모델을 서빙합니다.
  instance_type: ml.g6.2xlarge

  # vLLM 기본값 256은 Gemma 4의 큰 vocabulary 때문에 메모리를 많이 사용합니다.
  # 실습 규모에서는 32로 낮춰 OOM 위험을 줄입니다.
  max_num_seqs: 32

  # 컨테이너 환경변수와 표시 형식을 맞추기 위해 문자열로 유지합니다.
  gpu_memory_utilization: "0.90"

  # 단일 GPU 기준 1. 멀티 GPU 인스턴스로 갈 때만 키웁니다.
  # LMI는 common/dlc.serving_env가 해당 형식으로 변환합니다.
  tensor_parallel: "1"

  # 리전과 무관한 version과 tag_suffix만 저장합니다. 완전한 URI는 .env에서 지정할 수 있습니다.
  # Gemma 4에는 vLLM 0.19 이상이 필요합니다. LMI는 태그의 lmi<NN> 버전도 확인하세요.
  images:
    vllm:
      version: "0.26.0"                                            # ECR 실조회
      tag_suffix: gpu-py312-cu130-ubuntu22.04-sagemaker-v1.1
    sglang:
      version: "0.5.15"
      tag_suffix: gpu-py312-cu130-ubuntu24.04-sagemaker             # SGLang은 Ubuntu 24.04
    lmi:
      version: "0.36.0"                                            # 태그: 0.36.0-lmi27.0.0-cu130

# ---------------------------------------------------------------------------
# 데이터
# ---------------------------------------------------------------------------
data:
  # 앞부분은 학습에 사용하고 평가는 그 이후 구간에서 추출합니다.
  num_seed_samples: 300

  # 요약 코스는 입력이 길어 기본 합성 건수를 100으로 둡니다.
  num_synthetic: 100

  # 동시 Bedrock 호출 수. throttling(429)이 나면 낮추세요.
  synth_max_workers: 10

  # 기존 학습 산출물 경로와 연결되므로 저장소 이름과 무관하게 유지합니다.
  s3_prefix: gemma-e2e-toolkit

  # dry-run에서 사용할 소량 데이터입니다.
  dry_run_seed_samples: 8
  dry_run_synthetic: 6

# ---------------------------------------------------------------------------
# 평가
# ---------------------------------------------------------------------------
evaluation:
  num_examples: 50              # 튜토리얼 기본. 정식 측정은 키우세요
  dry_run_num_examples: 20

  # 엔드포인트 동시 호출 수입니다. 429나 타임아웃이 발생하면 낮추세요.
  workers: 8

  # 요약과 QA 코스의 Bedrock LLM judge 호출 수입니다. 0이면 건너뜁니다.
  judge_max_examples: 20

# ---------------------------------------------------------------------------
# 성능 측정
# ---------------------------------------------------------------------------
# `sm-endpoint-bmt`를 사용하며 지표는 `vllm bench serve` 규약을 따릅니다.
# 명령줄의 `--` 뒤에 지정한 인자가 아래 값을 덮습니다.
# 확인: python pipelines/run_benchmark.py --course extraction --print-command
benchmark:
  # 기본값은 빠른 확인용입니다. 용량 산정 시 수백 건으로 늘리세요.
  num_prompts: 20
  dry_run_num_prompts: 4

  # serving.max_num_seqs를 넘기면 컨테이너에서 대기하므로 그 값 이하에서
  # 시작하는 편이 해석하기 쉽습니다.
  max_concurrency: 4

  # "inf"는 모든 요청을 즉시 보냅니다. 숫자는 초당 요청 수이며 도착 간격은 지수분포입니다.
  request_rate: "inf"

  # random 데이터셋의 입력과 출력 길이입니다. 실제 데이터는 명령줄에서 dataset을 지정하세요.
  input_len: 256
  output_len: 128

  # 첫 호출의 TLS 연결과 캐시 영향을 제거하기 위해 워밍업은 지표에서 제외합니다.
  num_warmups: 2

  # 평균과 함께 확인할 백분위입니다.
  percentiles: "50,95,99"

  # 요청별 값을 포함한 JSON 결과를 저장합니다.
  save_results: true

# ---------------------------------------------------------------------------
# AWS 설정
# ---------------------------------------------------------------------------
aws:
  # 비우면 Session().default_bucket()을 사용합니다. 계정별 버킷 이름은 저장하지 마세요.
  s3_bucket: ""

  # 합성 데이터와 LLM judge에 사용할 모델입니다. inference profile 접두사가 필요합니다.
  bedrock_model_id: global.anthropic.claude-sonnet-5

  # true면 실행 역할이 없을 때 광범위한 권한의 기본 역할을 생성합니다.
  create_default_role: false

# ---------------------------------------------------------------------------
# 실행 방식
# ---------------------------------------------------------------------------
runtime:
  # 프로젝트의 dry-run 스위치입니다. CLI의 --dry-run이 우선합니다.
  # 소량 데이터로 전 경로를 밟되 과금 리소스를 만들지 않습니다.
  dry_run: false

  # DEBUG | INFO | WARNING | ERROR
  log_level: INFO

  # 학습 Job과 엔드포인트 상태를 확인하는 주기입니다.
  poll_seconds: 30
