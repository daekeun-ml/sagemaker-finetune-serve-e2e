# =============================================================================
# config.yaml — pipelines/ 실행 설정 (🔴 이 파일은 커밋됩니다)
# =============================================================================
# `python pipelines/run_<course>.py` 가 읽습니다. pipelines/_config.py 가 값을 해당 env 키로
# 옮긴 뒤 common/config.py 를 다시 해석하므로 노트북과 CLI 가 같은 설정으로 돕니다.
#
# 우선순위:  셸/.env 의 기존 env  >  이 파일  >  common/config.py 기본값
#   1회 오버라이드는 셸에서: `TRAIN_INSTANCE_TYPE=ml.g6e.2xlarge python pipelines/run_extraction.py`
#
# 🔴 시크릿은 여기 두지 마세요. 아래 셋은 env 전용이고, 이 파일에 쓰면 로더가 경고하고 무시합니다.
#      · HF_TOKEN            → `hf auth login`
#      · SAGEMAKER_ROLE_ARN  → 비우면 IAM 에서 자동 탐지
#      · AWS_REGION          → 리전을 바꾸면 ECR 이미지 URI 리전도 함께 바뀌어야 해서 env 전용입니다
#
# 이 파일이 없어도 동작합니다 — pipelines/_config.py 의 DEFAULTS 가 같은 값을 씁니다.
# =============================================================================

# ---------------------------------------------------------------------------
# model — 어떤 gemma-4 를 학습/서빙할지
# ---------------------------------------------------------------------------
model:
  # E2B | E4B | 12B | 26B-A4B | 31B  (common/config.py GEMMA4_PRESETS)
  # E4B 가 기본입니다: effective 4.5B 라 단일 L4 24GB 에서 QLoRA 가 돌고, merge 단계 peak 호스트
  # RAM 이 실측 17.5GB < 32GB 로 들어갑니다. 더 큰 사이즈는 training.instance_type 도 올리세요.
  size: E4B

  # 프리셋 model_id 를 덮어쓸 때만 채웁니다(예: 사내 미러). 비우면 프리셋 값을 씁니다.
  id: ""

  # gemma-4 는 전 사이즈 apache-2.0 + ungated 라 false. gemma-3/2 처럼 gated 모델을 id 로 지정할
  # 때만 true — 그때만 서빙 컨테이너 env 에 HF 토큰이 실립니다(describe_endpoint 에 평문으로 남습니다).
  is_gated: false

# ---------------------------------------------------------------------------
# training — SFT 학습 잡 (tracks/*/scripts/train.py 를 ModelTrainer 로 제출)
# ---------------------------------------------------------------------------
training:
  # 프리셋은 ml.g5.2xlarge 지만 g6 를 씁니다 — g5 는 용량 대기가 깁니다. GPU 는 같은 급(L4 24GB)이고
  # 호스트 RAM 32GB 도 merge 에 충분합니다.
  instance_type: ml.g6.2xlarge

  # 🔴 반드시 명시합니다. 생략하면 SDK 가 1시간을 조용히 넣고, 그 한도는 학습만이 아니라
  #    Pending + Downloading + Training + merge/업로드 **전체**를 셉니다.
  #    실측(요약 코스): Pending 6분 + Downloading 3분 + Training 55분 → 1시간 도달로 merge 도중
  #    강제 종료. 학습은 끝났는데 서빙용 모델이 없어 배포가 불가능했고, 상태는 Stopped 이고
  #    FailureReason 이 비어 원인을 찾기 어려웠습니다.
  #    넉넉히 잡아도 손해가 없습니다 — 정상 종료 시점에 과금이 멈추므로 폭주 방지 상한입니다.
  max_runtime_hours: 4

  # 핸즈온 규모. 파이프라인이 끝까지 도는지 보는 것이 목적입니다.
  # 정식 학습은 max_train_samples: null(전량) + epochs 3~5 로 따로 돌리세요.
  epochs: 2
  max_train_samples: 200        # null = train.jsonl 전량

  # per_device 1 + accum 8 = 유효 배치 8. 24GB 카드에서 seq 2048 QLoRA 가 들어가는 조합입니다.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  use_qlora: true               # 4bit nf4 + double-quant. E2B 는 bf16 LoRA 로도 충분합니다
  merge_adapter: true           # 🔴 false 면 adapter/ 만 남아 배포할 수 없습니다

  lora:
    r: 16
    alpha: 16
    dropout: 0.05

  # ETA 추정용 실측값 — 제출 전에 이 설정이 max_runtime_hours 안에 끝나는지 계산해 경고합니다.
  # 실측 g6.2xlarge: max_seq_length 2048 ≈ 17s/step, 512 ≈ 7s/step.
  seconds_per_step: 17

  # 🔴 완전 URI 를 여기 두지 않습니다 — URI 에 리전이 박혀 있어 리전을 바꿀 때 한쪽만 고치면
  #    "리전별 private ECR 만 허용" 에러가 납니다. repository+tag 만 두면 common/dlc.py 가
  #    현재 AWS_REGION 으로 조립합니다. 둘 다 비우면 SDK 가 pytorch-training 을 자동 해석합니다.
  #    완전 URI 가 필요하면 .env 의 DLC_IMAGE_URI 를 쓰세요(env 최우선).
  dlc:
    repository: pytorch-training
    tag: 2.10.0-gpu-py313-cu130-ubuntu22.04-sagemaker-v1.7   # ECR 실조회 검증

# ---------------------------------------------------------------------------
# grpo — SFT 다음 GRPO 정련 (추출/분류 코스만)
# ---------------------------------------------------------------------------
grpo:
  # prompt 당 num_generations 개를 생성하므로 SFT 보다 오래 걸립니다.
  max_runtime_hours: 6

  # holdout | synth | failures
  # 🔴 기본 synth: holdout 은 무료지만 SFT 와 같은 분포라 rollout 이 전부 만점이 되어
  #    advantage ≈ 0 → gradient 가 거의 흐르지 않습니다(GPU 시간만 씁니다).
  #    실측(추출 코스): 제약 없이 합성하면 8건 전부 인자 0개였는데, 난이도 제약을 걸면
  #    인자 없음 0건 / 평균 인자 2.1개가 됩니다. failures 가 가장 강하지만 deploy+eval 이 먼저
  #    필요합니다. 상세: common/grpo_data.py
  prompt_source: synth
  num_prompts: 100              # rollout 때문에 느립니다 — 작게 시작하세요
  epochs: 1
  learning_rate: 1.0e-5         # SFT(2e-4)보다 낮게 — 정책이 무너지지 않게
  num_generations: 8            # 그룹 크기. 클수록 신호와 연산이 함께 늘어납니다
  max_completion_length: 256

# ---------------------------------------------------------------------------
# serving — real-time endpoint (vLLM / SGLang / DJL LMI, 셋 다 OpenAI 호환)
# ---------------------------------------------------------------------------
serving:
  # vllm(기본) | sglang | lmi. 셋 다 messages 스키마를 받아 호출 코드가 같습니다.
  # E2B/E4B 도 vLLM 으로 뜹니다 — train.py 가 KV-shared 텐서를 복원해 저장하기 때문입니다
  # (복원 전 665키 → vLLM 실패 / 복원 후 719키 = 원본과 동일, vLLM 이슈 #44788).
  engine: vllm

  # 학습과 같은 이유로 g6. L4 24GB 로 E4B bf16 서빙에 여유가 있습니다.
  instance_type: ml.g6.2xlarge

  # 🔴 vLLM 기본값 256 을 32 로 낮춥니다. 샘플러 logits 버퍼가 max_num_seqs x vocab x 4B 이고
  #    gemma-4 의 vocab 은 262,144 라 256 이면 256 MiB 를 잡습니다. 실측(E4B bf16 14.23 GiB):
  #    KV 캐시 배정 후 여유가 0.47 GiB 뿐이었고, 멀티모달 코스는 vision tower 로 1 GiB 더 커서
  #    같은 설정에서 CUDA OOM 으로 배포가 실패했습니다. 32 면 버퍼가 32 MiB 로 줄고, 실습 규모
  #    (동시 1~2건)에서는 손실이 없습니다.
  #    증상이 'did not pass the ping health check' 로만 보여 원인을 찾기 어렵습니다 —
  #    실제 OOM 은 CloudWatch endpoint 로그에만 남습니다.
  max_num_seqs: 32

  # 🔴 문자열로 둡니다. float 0.90 을 str() 하면 "0.9" 가 되어(끝자리 0이 사라짐) 컨테이너 env 에
  #    찍히는 값이 이 파일과 달라 보입니다. 엔진 동작은 같지만 디버깅이 어렵습니다.
  gpu_memory_utilization: "0.90"

  # 단일 GPU 기준 1. 멀티 GPU 인스턴스로 갈 때만 키웁니다.
  # (lmi 는 관용구가 'max' 라 common/dlc.serving_env 가 알아서 바꿉니다.)
  tensor_parallel: "1"

  # training.dlc 와 같은 이유로 리전 없는 version + tag_suffix 만 둡니다.
  # 완전 URI 는 .env 의 VLLM_IMAGE_URI / SGLANG_IMAGE_URI / LMI_IMAGE_URI(env 최우선).
  # 🔴 gemma-4 서빙에는 vLLM >= 0.19 가 필요합니다. LMI 는 태그의 lmi<NN> 부분이 번들 vLLM 버전을
  #    정하므로(앞의 0.36.0 은 djl-serving 버전), 태그를 바꾸면 번들 버전을 확인하세요.
  images:
    vllm:
      version: "0.26.0"                                            # ECR 실조회
      tag_suffix: gpu-py312-cu130-ubuntu22.04-sagemaker-v1.1
    sglang:
      version: "0.5.15"
      tag_suffix: gpu-py312-cu130-ubuntu24.04-sagemaker             # ⚠️ 24.04 (vLLM 은 22.04)
    lmi:
      version: "0.36.0"                                            # → 태그 0.36.0-lmi27.0.0-cu130

# ---------------------------------------------------------------------------
# data — 시드 로드 + grounded 합성 + 학습 JSONL
# ---------------------------------------------------------------------------
data:
  # 시드에서 학습에 쓸 앞부분 건수. 평가(held-out)는 **이 건수 뒤** 인덱스에서 잘라 씁니다 —
  # 그래야 학습 구간과 겹치지 않습니다.
  num_seed_samples: 300

  # 요약 코스는 seed 문서가 커서 호출당 지연이 큽니다(실측: seed 1건 중앙 1,651자 vs 추출 475자).
  # 잘림은 없으니 낭비가 아니라 순수 지연이고, 그래서 200 이 아니라 100 입니다.
  num_synthetic: 100

  # 동시 Bedrock 호출 수. throttling(429)이 나면 낮추세요.
  synth_max_workers: 10

  # 🔴 리포 이름과 무관하게 유지합니다 — 바꾸면 기존 학습 산출물 S3 경로를 못 찾습니다.
  s3_prefix: gemma-e2e-toolkit

  # --dry-run 일 때의 소량 값(과금 리소스를 만들지 않습니다).
  dry_run_seed_samples: 8
  dry_run_synthetic: 6

# ---------------------------------------------------------------------------
# evaluation — held-out 평가 (답이 맞는지)
# ---------------------------------------------------------------------------
evaluation:
  num_examples: 50              # 튜토리얼 기본. 정식 측정은 키우세요
  dry_run_num_examples: 20

  # endpoint 동시 호출 수. 세 엔진 모두 연속 배칭이라 8부터 시작 — 429/타임아웃이 나면 낮추세요.
  workers: 8

  # Bedrock LLM-judge 채점 건수(요약/QA 코스만, 호출량 과금). 0 이면 judge 를 건너뜁니다.
  judge_max_examples: 20

# ---------------------------------------------------------------------------
# benchmark — 속도 측정, pipelines/run_benchmark.py (얼마나 빨리 오는지)
# ---------------------------------------------------------------------------
# 측정은 sm-endpoint-bmt 가 합니다(설치: uv pip install -e '.[bench]'). 지표 정의는
# `vllm bench serve` 를 따릅니다(TTFT / TPOT / ITL / E2EL). 아래 값은 그 도구의 CLI 인자로
# 옮겨지며, 명령줄 `--` 뒤에 준 인자가 이 값을 덮습니다.
#   확인:  python pipelines/run_benchmark.py --course extraction --print-command
benchmark:
  # 기본값이 작은 이유: endpoint 는 시간당 과금이라 확인용 실행이 몇십 초에 끝나야 합니다.
  # 용량 산정을 하려면 수백 건으로 올리세요.
  num_prompts: 20
  dry_run_num_prompts: 4

  # 동시 요청 수. serving.max_num_seqs 를 넘겨도 컨테이너 안에서 큐를 서므로 그 값 이하에서
  # 시작하는 편이 해석하기 쉽습니다.
  max_concurrency: 4

  # "inf" = 전부 한꺼번에(순간 부하). 숫자를 주면 초당 요청 수로 도착을 조절하며, 간격은
  # 지수분포입니다 — 고정 간격은 실제 트래픽보다 고르게 들어가 큐 대기를 과소평가합니다.
  request_rate: "inf"

  # random 데이터셋의 입력·출력 길이(토큰). 실제 코스 입력으로 재려면 `-- --dataset-name
  # huggingface --dataset-path ...` 로 데이터셋을 바꿔 주세요.
  input_len: 256
  output_len: 128

  # 🔴 워밍업은 지표에서 제외됩니다. 첫 호출은 TLS 수립과 컨테이너 캐시가 섞여 TTFT 백분위를
  #    혼자 끌어올립니다.
  num_warmups: 2

  # 낼 백분위(--metric-percentiles). vLLM 기본은 "99" 하나지만 셋을 냅니다 —
  # 평균이 좋아도 p99 가 나쁘면 일부 요청은 늘 느립니다. 지표마다 mean·median 과 함께 나옵니다.
  percentiles: "50,95,99"

  # 결과를 JSON 으로 저장합니다(--save-result --save-detailed: 요청별 값까지 포함).
  # 경로를 바꾸려면 `-- --result-dir <디렉터리>`.
  save_results: true

# ---------------------------------------------------------------------------
# aws — 시크릿이 아닌 AWS 설정 (region/role 은 env 전용, 파일 상단 참고)
# ---------------------------------------------------------------------------
aws:
  # 비우면 Session().default_bucket() 을 씁니다.
  # 🔴 계정 ID 가 들어간 버킷 이름을 여기 박지 마세요 — 커밋되는 파일입니다.
  s3_bucket: ""

  # 합성 데이터와 LLM-judge 에 쓰는 모델. inference-profile prefix(us./eu./apac./global.)가
  # 반드시 붙습니다. ⚠️ 모델 로스터는 자주 바뀌니 다른 계정·리전에서는 콘솔에서 재확인하세요.
  bedrock_model_id: global.anthropic.claude-sonnet-5

  # 🔴 기본 false. true 면 실행 role 이 없을 때 AmazonSageMaker-DefaultRole 을 자동 생성하는데
  #    거기에 AmazonSageMakerFullAccess(광범위)가 붙습니다. opt-in 으로만 허용합니다.
  create_default_role: false

# ---------------------------------------------------------------------------
# runtime — 실행 방식
# ---------------------------------------------------------------------------
runtime:
  # 이 kit 의 유일한 dry-run 스위치입니다(DRY_RUN env 로 변환). CLI 의 --dry-run 이 이깁니다.
  # 소량 데이터로 전 경로를 밟되 과금 리소스를 만들지 않습니다.
  dry_run: false

  # DEBUG | INFO | WARNING | ERROR
  log_level: INFO

  # 학습 잡·endpoint 상태 폴링 주기(초).
  poll_seconds: 30
