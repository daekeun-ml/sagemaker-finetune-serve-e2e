# =============================================================================
# config.yaml — pipelines/ 실행 설정 (🔴 이 파일은 커밋됩니다)
# =============================================================================
# 이 파일은 `python pipelines/run_<course>.py` 가 읽는 설정입니다. 값은 pipelines/_config.py 가
# 해당 os.environ 키로 변환한 뒤 common/config.py 를 다시 해석하므로, **노트북과 CLI 가 같은
# 설정으로 돕니다**(런타임 진실은 여전히 common/config.py 하나).
#
# 우선순위:  셸/.env 의 기존 env  >  이 파일  >  common/config.py 내장 기본값
#   → 1회 오버라이드는 그냥 셸에서: `TRAIN_INSTANCE_TYPE=ml.g6e.2xlarge python pipelines/run_extraction.py`
#
# 🔴 시크릿은 여기 두지 마세요 — 커밋되는 파일입니다. 아래 3개는 **env 전용**이고, 이 파일에 쓰면
#    로더가 크게 경고하고 무시합니다:
#      · HF_TOKEN            → `hf auth login` (파일로 저장, common/config.py 가 읽음)
#      · SAGEMAKER_ROLE_ARN  → `export SAGEMAKER_ROLE_ARN=arn:aws:iam::<ACCT>:role/<name>`
#                              (비우면 config.resolve_sagemaker_role() 이 IAM 에서 자동 탐지)
#      · AWS_REGION          → `export AWS_REGION=us-west-2` (또는 .env)
#    리전을 설정 파일에 박지 않는 이유: 리전을 바꾸면 ECR 이미지 URI 리전까지 함께 맞춰야 해서
#    (common/dlc.py) '파일에 박힌 리전'이 가장 잘 어긋납니다.
#
# 이 파일이 없어도 동작합니다 — pipelines/_config.py 의 DEFAULTS 가 아래와 동일한 값을 씁니다.
# =============================================================================

# ---------------------------------------------------------------------------
# model — 어떤 gemma-4 를 학습/서빙할지
# ---------------------------------------------------------------------------
model:
  # E2B | E4B | 12B | 26B-A4B | 31B  (common/config.py GEMMA4_PRESETS)
  # 🔴 E4B 가 기본: effective 4.5B 라 단일 L4 24GB 에서 QLoRA 여유가 있고, 학습 후 merge 단계의
  #    peak 호스트 RAM 이 실측 17.5GB < 32GB(g6.2xlarge) 로 들어갑니다. 12B/26B/31B 는 merge 시
  #    RAM·GPU 가 더 커서 프리셋이 더 큰 인스턴스를 지정합니다(아래 training.instance_type 도 함께 올리세요).
  size: E4B
  # 프리셋 model_id 를 직접 덮어쓸 때만 채웁니다(예: google/gemma-4-12B-it, 사내 미러).
  # 비워 두면 size 프리셋의 model_id 를 씁니다.
  id: ""
  # gemma-4 전 사이즈는 apache-2.0 + ungated 라 false 로 둡니다. gemma-3/2 처럼 gated 모델을
  # id 로 지정할 때만 true — 그때만 서빙 컨테이너 env 에도 HF 토큰이 실립니다
  # (common/config.get_serving_hf_token(): 토큰은 describe_endpoint 메타데이터에 평문으로 남습니다).
  is_gated: false

# ---------------------------------------------------------------------------
# training — SFT 학습 잡 (tracks/*/scripts/train.py 를 ModelTrainer 로 제출)
# ---------------------------------------------------------------------------
training:
  # 🔴 프리셋 값은 ml.g5.2xlarge 인데 g6 를 씁니다 — g5 는 용량 대기(InsufficientInstanceCapacity /
  #    Pending 장시간)가 길어서입니다. g6.2xlarge = L4 24GB GPU + 32GB RAM 으로 GPU 는 g5(A10G 24GB)와
  #    같은 급이고 호스트 RAM 도 merge(실측 peak 17.5GB)에 충분합니다.
  instance_type: ml.g6.2xlarge

  # 🔴 반드시 명시해야 하는 값입니다. stopping_condition 을 생략하면 SDK 가 3600초(1시간)를 조용히
  #    넣습니다(sagemaker/train/defaults.py DEFAULT_MAX_RUNTIME_IN_SECONDS). 이 한도는 학습 시간만이
  #    아니라 Pending(용량 대기) + Downloading(이미지 pull) + Training + merge/업로드 **전체**를 셉니다.
  #    실측(03_summarization, ml.g6.2xlarge): Pending 6분 + Downloading 3분 + Training 55분(189 step
  #    전부 완료) → 1시간 도달로 **merge 도중 강제 종료**. 학습은 100% 끝났는데 서빙용 머지 모델이
  #    없어 배포가 불가능했고, MaxRuntimeExceeded 는 FailureReason 도 비어 있어(상태만 Stopped)
  #    원인을 찾기 어려웠습니다. 넉넉히 잡아도 손해가 없습니다 — 잡이 정상 종료되면 그 시점에 과금이
  #    멈추므로 이 값은 요금이 아니라 폭주 방지 상한입니다(API 최대 28일).
  max_runtime_hours: 4

  # 핸즈온 규모. 파이프라인이 끝까지 도는지 확인하는 것이 목적이라 짧게 잡았습니다.
  # 정식 학습은 max_train_samples: null(전량) + epochs: 3~5 로 올려 따로 돌리세요.
  epochs: 2
  max_train_samples: 200        # null = train.jsonl 전량

  # per_device 1 + accum 8 = 유효 배치 8. 24GB 카드에서 seq 2048 QLoRA 가 들어가는 조합입니다.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4         # Gemma LoRA 관용구
  use_qlora: true               # 4bit nf4 + double-quant. E2B 는 bf16 LoRA 로도 충분(프리셋 참고)
  merge_adapter: true           # 서빙용 단일 모델을 만듭니다. false 면 adapter/ 만 남아 배포 불가

  lora:
    r: 16
    alpha: 16
    dropout: 0.05

  # ETA 추정용 실측값(제출 전 "이 설정이 max_runtime_hours 안에 끝나는지" 를 계산해 경고합니다).
  # 실측 g6.2xlarge: max_seq_length 2048 ≈ 17s/step, 512 ≈ 7s/step. 짧은 코스(분류)면 낮추세요.
  seconds_per_step: 17

  # 학습 DLC 이미지. 🔴 완전 URI 를 여기 두지 않습니다 — URI 에는 리전이 박혀 있어(763104351884.dkr.ecr.
  #    us-west-2...) 커밋 파일에 넣으면 리전 변경 시 한쪽만 고쳐 "CreateTrainingJob 은 리전별 private
  #    ECR 만 허용" 에러가 납니다. repository+tag 만 두면 common/dlc.py 가 현재 AWS_REGION 으로 조립합니다.
  #    둘 다 비우면 sagemaker image_uris.retrieve 가 pytorch-training 을 자동 해석합니다.
  #    완전 URI 를 쓰려면 .env 의 DLC_IMAGE_URI 를 쓰세요(env 가 최우선).
  #    현행 태그 확인: aws ecr describe-images --registry-id 763104351884 \
  #      --repository-name pytorch-training --region <region> \
  #      --query 'reverse(sort_by(imageDetails,&imagePushedAt))[:5].imageTags'
  dlc:
    repository: pytorch-training
    tag: 2.10.0-gpu-py313-cu130-ubuntu22.04-sagemaker-v1.7   # ECR 실조회 검증 2026-07-30

# ---------------------------------------------------------------------------
# grpo — SFT 다음 GRPO 정련 (추출/분류 코스만. reward 를 프로그램으로 채점할 수 있는 코스)
# ---------------------------------------------------------------------------
grpo:
  # GRPO 는 prompt 당 num_generations 개를 생성(rollout)하므로 SFT 보다 오래 걸립니다.
  max_runtime_hours: 6

  # holdout | synth | failures
  # 🔴 기본 synth: holdout 은 무료지만 SFT 와 같은 분포라 rollout 이 전부 만점이 되어
  #    advantage ≈ 0 → gradient 가 거의 흐르지 않습니다(GPU 시간만 쓰고 배우는 게 없음).
  #    synth 는 생성 프롬프트에 난이도 제약을 걸어 어려운 예시를 만듭니다 — 실측(추출 코스):
  #    제약 없이 합성하면 8건 전부 인자 0개(seed 분포가 인자 없는 함수 94%)였는데, 제약을 걸면
  #    인자 없음 0건 / 평균 인자 2.1개가 됩니다. failures(평가에서 틀린 건만)가 가장 강하지만
  #    deploy+eval 선행이 필요합니다. 상세: common/grpo_data.py
  prompt_source: synth
  num_prompts: 100              # rollout 때문에 느립니다 — 작게 시작하세요
  epochs: 1
  learning_rate: 1.0e-5         # SFT(2e-4)보다 낮게 — 정책이 무너지지 않게
  num_generations: 8            # 그룹 크기. 클수록 신호↑·연산↑
  max_completion_length: 256

# ---------------------------------------------------------------------------
# serving — real-time endpoint (vLLM / SGLang / DJL LMI — 셋 다 연속배칭 + OpenAI 호환)
# ---------------------------------------------------------------------------
serving:
  # vllm(기본) | sglang | lmi. 셋 다 messages 스키마를 받으므로 호출 코드가 동일합니다.
  # E2B/E4B 도 vLLM 으로 뜹니다 — train.py 가 KV-shared dead weight 를 복원해 저장하기 때문입니다
  # (복원 전 665키 → vLLM 실패 / 복원 후 719키 = 원본과 동일 → 정상 로드, vLLM 이슈 #44788).
  engine: vllm

  # 학습과 동일한 이유로 g6(용량 대기). L4 24GB 로 E4B bf16 서빙에 여유가 있습니다.
  instance_type: ml.g6.2xlarge

  # 🔴 vLLM 기본값은 256 인데 32 로 낮춥니다. 샘플러 logits 버퍼가 max_num_seqs × vocab × 4B 인데
  #    gemma-4 의 vocab 은 262,144 라 256 × 262144 × 4B = 256 MiB 를 잡습니다. 실측(이 kit endpoint,
  #    vLLM 0.26.0, E4B bf16 14.23 GiB): KV 캐시 배정 후 남은 여유가 0.47 GiB 뿐이었고, 멀티모달
  #    코스는 vision tower 로 가중치가 1 GiB 더 커서 같은 설정에서 CUDA OOM 으로 배포가 Failed 했습니다.
  #    32 면 버퍼가 32 MiB 로 줄고, 실습은 동시 요청 1~2건이라 손실이 없습니다.
  #    증상이 'did not pass the ping health check' 로만 보여 원인을 찾기 어렵습니다 —
  #    실제 torch.OutOfMemoryError 는 CloudWatch endpoint 로그에만 남습니다.
  #    동시 처리량이 필요하면 이 값을 올리되 ml.g6e.2xlarge(L40S 45GB)처럼 큰 GPU 로 가세요.
  max_num_seqs: 32

  # 🔴 **문자열**로 둡니다. float 0.90 을 str() 하면 "0.9" 가 되어(파이썬이 끝자리 0을 버림)
  #    컨테이너 env 에 찍히는 값이 이 파일의 주석과 달라 보입니다. 엔진 동작은 같지만 디버깅에
  #    불리합니다(common/dlc.serving_env 독스트링과 같은 이유).
  gpu_memory_utilization: "0.90"

  # 단일 GPU 인스턴스 기준 1. 멀티 GPU(g5.12xlarge 등)로 올릴 때만 키웁니다.
  # (lmi 엔진은 관용구가 'max' 라 common/dlc.serving_env 가 알아서 바꿉니다.)
  tensor_parallel: "1"

  # 서빙 DLC 이미지 — training.dlc 와 같은 이유로 리전 없는 version + tag_suffix 만 둡니다.
  # 완전 URI 가 필요하면 .env 의 VLLM_IMAGE_URI / SGLANG_IMAGE_URI / LMI_IMAGE_URI(env 최우선).
  # 🔴 gemma-4 서빙엔 vLLM >= 0.19 필요 → 아래 값이 충족합니다. 구 LMI(번들 vLLM 낮음)는 불가.
  images:
    vllm:
      version: "0.26.0"                                            # ECR 실조회 2026-07-30
      tag_suffix: gpu-py312-cu130-ubuntu22.04-sagemaker-v1.1
    sglang:
      version: "0.5.15"
      tag_suffix: gpu-py312-cu130-ubuntu24.04-sagemaker             # ⚠️ ubuntu 24.04 (vLLM 은 22.04)
    lmi:
      version: "0.36.0"                                            # → 태그 0.36.0-lmi27.0.0-cu130

# ---------------------------------------------------------------------------
# data — 시드 로드 + grounded 합성 + 학습 JSONL
# ---------------------------------------------------------------------------
data:
  # 시드에서 학습에 쓸 앞부분 건수. 평가(held-out)는 **이 건수 뒤** 인덱스에서 잘라 씁니다 —
  # 그래야 학습 구간과 겹치지 않습니다(넉넉히 로드해 뒤쪽 N건을 쓰는 방식은 held-out 이 학습
  # 구간 안쪽으로 들어가 점수가 부풀려집니다).
  num_seed_samples: 300

  # 🔴 200 이 아니라 100 입니다. 요약 코스는 seed 문서가 커서 호출당 지연이 큽니다(실측: seed 1건
  #    중앙 1,651자 vs 추출 475자 → 배치 프롬프트 ~10,900자). 잘림은 없습니다(출력 2,554토큰 <
  #    max_tokens 4,500) — 헛돈 호출이 아니라 순수 지연이라 건수를 낮추는 게 맞습니다.
  num_synthetic: 100

  # 동시 Bedrock 호출 수. throttling(429)이 나면 낮추세요.
  synth_max_workers: 10

  # 🔴 리포 이름과 무관하게 유지합니다 — 바꾸면 기존 학습 산출물 S3 경로를 못 찾습니다.
  s3_prefix: gemma-e2e-toolkit

  # --dry-run 일 때의 소량 값(파이프라인만 검증. AWS 과금 리소스를 만들지 않습니다).
  dry_run_seed_samples: 8
  dry_run_synthetic: 6

# ---------------------------------------------------------------------------
# evaluation — held-out 평가
# ---------------------------------------------------------------------------
evaluation:
  # 튜토리얼 기본 50(단건 서빙 기준 ~1~2분). 정식 벤치는 키우세요.
  num_examples: 50
  dry_run_num_examples: 20
  # endpoint 동시 호출 수. 세 엔진 모두 연속 배칭이라 8부터 시작 — 429/타임아웃이 나면 낮추세요.
  workers: 8
  # Bedrock LLM-judge 로 채점할 최대 건수(요약/QA 코스만 사용, 호출량 과금). 0 이면 judge 생략.
  judge_max_examples: 20

# ---------------------------------------------------------------------------
# aws — 시크릿이 아닌 AWS 설정 (region/role 은 env 전용 — 파일 상단 참고)
# ---------------------------------------------------------------------------
aws:
  # 비우면 sagemaker Session().default_bucket() (sagemaker-<region>-<account>)을 씁니다.
  # 🔴 계정 ID 가 들어간 버킷 이름을 여기 박지 마세요 — 커밋되는 파일입니다.
  s3_bucket: ""

  # 합성 데이터 생성 + LLM-judge 에 쓰는 reasoning 모델. inference-profile prefix
  # (us./eu./apac./global.)가 반드시 붙어야 합니다. 최신(5+) Claude 는 dateless pinned-snapshot 형식.
  # ⚠️ 모델 로스터는 자주 바뀝니다 — 다른 계정/리전에선 Bedrock 콘솔에서 현행 ID 를 재확인하세요.
  bedrock_model_id: global.anthropic.claude-sonnet-5

  # 🔴 기본 false 로 둡니다. true 면 실행 role 이 하나도 없을 때 AmazonSageMaker-DefaultRole 을
  #    자동 생성하는데, 거기에 AmazonSageMakerFullAccess(광범위)가 붙습니다. 실수로 과한 권한 role 이
  #    만들어지지 않도록 opt-in 으로만 허용합니다(iam:CreateRole 권한도 필요).
  create_default_role: false

# ---------------------------------------------------------------------------
# runtime — 실행 방식
# ---------------------------------------------------------------------------
runtime:
  # 🔴 이 kit 의 유일한 dry-run 스위치입니다(common/config.is_dry_run() 이 읽는 DRY_RUN env 로
  #    변환됩니다). CLI 의 --dry-run 이 이 값을 이깁니다. dry-run 은 소량 데이터로 전 경로를 밟되
  #    과금 리소스(학습 잡·endpoint)를 만들지 않습니다.
  dry_run: false

  # DEBUG | INFO | WARNING | ERROR (common/logging_utils.setup_logging 이 읽습니다)
  log_level: INFO

  # 학습 잡/endpoint 상태 폴링 주기(초). 노트북과 같은 30초.
  poll_seconds: 30
