<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Managed MLflow 사용 흐름</title>
  <desc id="desc">MLflow App 준비와 연결 설정은 처음 한 번 수행하고, 파이프라인 실행마다 상위 실행, 학습 하위 실행, 평가 결과를 기록한 뒤 UI에서 비교합니다.</desc>

  <style>
    :root {
      --fg: #202124;
      --muted: #5f6368;
      --panel-fill: #f8f9fa;
      --panel-stroke: #adb5bd;
      --setup-fill: #e7f0ff;
      --setup-stroke: #4c6ef5;
      --run-fill: #ebfbee;
      --run-stroke: #2f9e44;
      --compare-fill: #f3e8ff;
      --compare-stroke: #7c3aed;
      --arrow: #6c757d;
      --number-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e5e7eb;
        --muted: #a8b2c1;
        --panel-fill: #172033;
        --panel-stroke: #475569;
        --setup-fill: #1d2d5a;
        --setup-stroke: #60a5fa;
        --run-fill: #0d3b30;
        --run-stroke: #34d399;
        --compare-fill: #352154;
        --compare-stroke: #a78bfa;
        --arrow: #94a3b8;
        --number-fg: #ffffff;
      }
    }
    .text {
      fill: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR",
                   Helvetica, Arial, sans-serif;
    }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: var(--muted); }
    .section-label { font-size: 13px; font-weight: 700; fill: var(--muted); }
    .card-title { font-size: 16px; font-weight: 700; }
    .card-body { font-size: 12px; }
    .card-note { font-size: 11px; fill: var(--muted); }
    .mono {
      font-size: 12px;
      font-family: SFMono-Regular, Consolas, Menlo, monospace;
    }
    .step-number {
      fill: var(--number-fg);
      font-size: 12px;
      font-weight: 700;
    }
    .panel { fill: var(--panel-fill); stroke: var(--panel-stroke); stroke-width: 2; }
    .setup-card { fill: var(--setup-fill); stroke: var(--setup-stroke); stroke-width: 2; }
    .run-card { fill: var(--run-fill); stroke: var(--run-stroke); stroke-width: 2; }
    .compare-card { fill: var(--compare-fill); stroke: var(--compare-stroke); stroke-width: 2; }
    .setup-number { fill: var(--setup-stroke); }
    .run-number { fill: var(--run-stroke); }
    .compare-number { fill: var(--compare-stroke); }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 2.5; }
    .arrow-head { fill: var(--arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path class="arrow-head" d="M0 0 L12 6 L0 12 Z"/>
    </marker>
  </defs>

  <text class="text title" x="600" y="46" text-anchor="middle">Managed MLflow 사용 흐름</text>
  <text class="text subtitle" x="600" y="74" text-anchor="middle">최초 한 번 연결한 뒤 파이프라인 실행마다 실험 기록이 쌓입니다</text>

  <rect class="panel" x="100" y="104" width="1000" height="176" rx="16"/>
  <text class="text section-label" x="128" y="135">최초 1회 설정</text>

  <rect class="setup-card" x="150" y="153" width="400" height="98" rx="12"/>
  <circle class="setup-number" cx="178" cy="180" r="15"/>
  <text class="text step-number" x="178" y="185" text-anchor="middle">1</text>
  <text class="text card-title" x="350" y="181" text-anchor="middle">MLflow App 준비</text>
  <text class="text card-body" x="350" y="210" text-anchor="middle">App 생성 또는 기존 App 선택</text>
  <text class="text card-note" x="350" y="233" text-anchor="middle">S3 버킷과 실행 역할 확인</text>

  <path class="flow" d="M550 202 H638" marker-end="url(#arrow)"/>

  <rect class="setup-card" x="650" y="153" width="400" height="98" rx="12"/>
  <circle class="setup-number" cx="678" cy="180" r="15"/>
  <text class="text step-number" x="678" y="185" text-anchor="middle">2</text>
  <text class="text card-title" x="850" y="181" text-anchor="middle">연결 설정</text>
  <text class="text mono" x="850" y="210" text-anchor="middle">USE_MLFLOW=1</text>
  <text class="text card-note" x="850" y="233" text-anchor="middle">App 이름 자동 탐색 또는 ARN 지정</text>

  <path class="flow" d="M600 280 V322" marker-end="url(#arrow)"/>

  <rect class="panel" x="40" y="333" width="1120" height="242" rx="16"/>
  <text class="text section-label" x="68" y="365">파이프라인 실행마다</text>

  <rect class="run-card" x="70" y="393" width="240" height="148" rx="12"/>
  <circle class="run-number" cx="97" cy="420" r="15"/>
  <text class="text step-number" x="97" y="425" text-anchor="middle">3</text>
  <text class="text card-title" x="190" y="425" text-anchor="middle">상위 실행 시작</text>
  <text class="text card-body" x="190" y="461" text-anchor="middle">파이프라인 설정과 단계 상태</text>
  <text class="text card-note" x="190" y="486" text-anchor="middle">AWS 리소스 위치 기록</text>

  <path class="flow" d="M310 467 H338" marker-end="url(#arrow)"/>

  <rect class="run-card" x="350" y="393" width="240" height="148" rx="12"/>
  <circle class="run-number" cx="377" cy="420" r="15"/>
  <text class="text step-number" x="377" y="425" text-anchor="middle">4</text>
  <text class="text card-title" x="470" y="425" text-anchor="middle">학습 지표 기록</text>
  <text class="text card-body" x="470" y="461" text-anchor="middle">학습 하위 실행</text>
  <text class="text card-note" x="470" y="486" text-anchor="middle">손실, 처리량, 시스템 지표</text>

  <path class="flow" d="M590 467 H618" marker-end="url(#arrow)"/>

  <rect class="run-card" x="630" y="393" width="240" height="148" rx="12"/>
  <circle class="run-number" cx="657" cy="420" r="15"/>
  <text class="text step-number" x="657" y="425" text-anchor="middle">5</text>
  <text class="text card-title" x="750" y="425" text-anchor="middle">평가 결과 기록</text>
  <text class="text card-body" x="750" y="461" text-anchor="middle">평가 점수와 상세 결과</text>
  <text class="text mono" x="750" y="486" text-anchor="middle">eval_scores.json</text>

  <path class="flow" d="M870 467 H898" marker-end="url(#arrow)"/>

  <rect class="compare-card" x="910" y="393" width="240" height="148" rx="12"/>
  <circle class="compare-number" cx="937" cy="420" r="15"/>
  <text class="text step-number" x="937" y="425" text-anchor="middle">6</text>
  <text class="text card-title" x="1030" y="425" text-anchor="middle">UI에서 비교</text>
  <text class="text card-body" x="1030" y="461" text-anchor="middle">설정, 점수, 학습 지표 비교</text>
  <text class="text card-note" x="1030" y="486" text-anchor="middle">선택한 모델 S3 URI 확인</text>
</svg>
