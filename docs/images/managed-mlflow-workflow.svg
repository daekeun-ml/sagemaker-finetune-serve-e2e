<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">SageMaker Managed MLflow minimum workflow</title>
  <desc id="desc">Six steps from creating an MLflow App to logging runs, comparing results, and deploying models.</desc>
  <rect width="1200" height="430" fill="#0f1117"/>
  <text x="600" y="44" fill="#f8fafc" font-family="Courier New, monospace" font-size="20" font-weight="700" text-anchor="middle">Minimum workflow</text>
  <text x="600" y="68" fill="#94a3b8" font-family="Courier New, monospace" font-size="11" text-anchor="middle">The API stays the same; AWS provides the target and authorization</text>

  <path d="M202 205 H236" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <path d="M392 205 H426" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <path d="M582 205 H616" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <path d="M772 205 H806" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <path d="M962 205 H996" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <rect x="42" y="145" width="160" height="120" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="67" cy="169" r="14" fill="#1d4ed8"/>
  <text x="67" y="174" fill="#dbeafe" font-family="Courier New, monospace" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text x="122" y="194" fill="#93c5fd" font-family="Courier New, monospace" font-size="13" font-weight="700" text-anchor="middle">Create App</text>
  <text x="122" y="218" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">S3 bucket</text>
  <text x="122" y="236" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Execution role</text>

  <rect x="232" y="145" width="160" height="120" rx="8" fill="#2d1b4e" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="257" cy="169" r="14" fill="#6d28d9"/>
  <text x="257" y="174" fill="#ede9fe" font-family="Courier New, monospace" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text x="312" y="194" fill="#c4b5fd" font-family="Courier New, monospace" font-size="13" font-weight="700" text-anchor="middle">Install client</text>
  <text x="312" y="218" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">mlflow</text>
  <text x="312" y="236" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">sagemaker-mlflow</text>

  <rect x="422" y="145" width="160" height="120" rx="8" fill="#2d1b4e" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="447" cy="169" r="14" fill="#6d28d9"/>
  <text x="447" y="174" fill="#ede9fe" font-family="Courier New, monospace" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text x="502" y="194" fill="#c4b5fd" font-family="Courier New, monospace" font-size="13" font-weight="700" text-anchor="middle">Set ARN</text>
  <text x="502" y="218" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">set_tracking_uri()</text>
  <text x="502" y="236" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">IAM + SigV4</text>

  <rect x="612" y="145" width="160" height="120" rx="8" fill="#1c2d20" stroke="#34d399" stroke-width="2"/>
  <circle cx="637" cy="169" r="14" fill="#047857"/>
  <text x="637" y="174" fill="#d1fae5" font-family="Courier New, monospace" font-size="12" font-weight="700" text-anchor="middle">4</text>
  <text x="692" y="194" fill="#6ee7b7" font-family="Courier New, monospace" font-size="13" font-weight="700" text-anchor="middle">Log work</text>
  <text x="692" y="218" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Params | Metrics</text>
  <text x="692" y="236" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Models | Traces</text>

  <rect x="802" y="145" width="160" height="120" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="827" cy="169" r="14" fill="#1d4ed8"/>
  <text x="827" y="174" fill="#dbeafe" font-family="Courier New, monospace" font-size="12" font-weight="700" text-anchor="middle">5</text>
  <text x="882" y="194" fill="#93c5fd" font-family="Courier New, monospace" font-size="13" font-weight="700" text-anchor="middle">Compare in UI</text>
  <text x="882" y="218" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Runs | Charts</text>
  <text x="882" y="236" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Trace evaluation</text>

  <rect x="992" y="145" width="166" height="120" rx="8" fill="#0f2d1e" stroke="#10b981" stroke-width="2"/>
  <circle cx="1017" cy="169" r="14" fill="#047857"/>
  <text x="1017" y="174" fill="#d1fae5" font-family="Courier New, monospace" font-size="12" font-weight="700" text-anchor="middle">6</text>
  <text x="1075" y="194" fill="#6ee7b7" font-family="Courier New, monospace" font-size="13" font-weight="700" text-anchor="middle">Sync / deploy</text>
  <text x="1075" y="218" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Model Registry</text>
  <text x="1075" y="236" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">SageMaker endpoint</text>

  <rect x="210" y="310" width="780" height="62" rx="8" fill="#151923" stroke="#475569" stroke-dasharray="5,4"/>
  <text x="600" y="336" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11" font-weight="700" text-anchor="middle">Same API surface: start_run(), log_metric(), log_model(), tracing</text>
  <text x="600" y="356" fill="#94a3b8" font-family="Courier New, monospace" font-size="10" text-anchor="middle">AWS differences: ARN tracking URI, IAM permissions, customer S3, optional Registry sync</text>

  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
