<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">SageMaker Managed MLflow 구성</title>
  <desc id="desc">파이프라인과 SageMaker 학습 작업이 인증된 MLflow 클라이언트를 통해 MLflow App에 실험을 기록하고, 사용자는 UI와 관리형 메타데이터, S3 아티팩트를 조회합니다.</desc>

  <style>
    :root {
      --fg: #202124;
      --muted: #5f6368;
      --panel-fill: #f8f9fa;
      --panel-stroke: #adb5bd;
      --source-fill: #e7f0ff;
      --source-stroke: #4c6ef5;
      --client-fill: #f3e8ff;
      --client-stroke: #7c3aed;
      --app-fill: #d3f9d8;
      --app-stroke: #2f9e44;
      --chip-fill: #ebfbee;
      --output-fill: #e7f0ff;
      --output-stroke: #4c6ef5;
      --arrow: #4c6ef5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e5e7eb;
        --muted: #a8b2c1;
        --panel-fill: #172033;
        --panel-stroke: #475569;
        --source-fill: #1d2d5a;
        --source-stroke: #60a5fa;
        --client-fill: #352154;
        --client-stroke: #a78bfa;
        --app-fill: #0d3b30;
        --app-stroke: #34d399;
        --chip-fill: #065f46;
        --output-fill: #1d2d5a;
        --output-stroke: #60a5fa;
        --arrow: #60a5fa;
      }
    }
    .text {
      fill: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR",
                   Helvetica, Arial, sans-serif;
    }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: var(--muted); }
    .section-label { font-size: 13px; font-weight: 700; fill: var(--muted); }
    .box-title { font-size: 17px; font-weight: 700; }
    .box-body { font-size: 12px; }
    .box-note { font-size: 11px; fill: var(--muted); }
    .app-title { font-size: 21px; font-weight: 700; }
    .chip-text { font-size: 11px; font-weight: 700; }
    .panel { fill: var(--panel-fill); stroke: var(--panel-stroke); stroke-width: 2; }
    .source { fill: var(--source-fill); stroke: var(--source-stroke); stroke-width: 2; }
    .client { fill: var(--client-fill); stroke: var(--client-stroke); stroke-width: 2; }
    .app { fill: var(--app-fill); stroke: var(--app-stroke); stroke-width: 2.5; }
    .chip { fill: var(--chip-fill); stroke: var(--app-stroke); stroke-width: 1.2; }
    .output { fill: var(--output-fill); stroke: var(--output-stroke); stroke-width: 2; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 3; }
    .arrow-head { fill: var(--arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path class="arrow-head" d="M0 0 L12 6 L0 12 Z"/>
    </marker>
  </defs>

  <text class="text title" x="600" y="46" text-anchor="middle">SageMaker Managed MLflow 구성</text>
  <text class="text subtitle" x="600" y="74" text-anchor="middle">파이프라인과 학습 작업의 기록을 하나의 MLflow App에서 관리합니다</text>

  <rect class="panel" x="100" y="105" width="1000" height="170" rx="16"/>
  <text class="text section-label" x="128" y="135">실험 실행</text>

  <rect class="source" x="130" y="153" width="450" height="94" rx="12"/>
  <text class="text box-title" x="355" y="181" text-anchor="middle">파이프라인</text>
  <text class="text box-body" x="355" y="205" text-anchor="middle">데이터, 학습, 배포, 평가</text>
  <text class="text box-note" x="355" y="227" text-anchor="middle">설정, 단계 상태, 평가 점수 기록</text>

  <rect class="source" x="620" y="153" width="450" height="94" rx="12"/>
  <text class="text box-title" x="845" y="181" text-anchor="middle">SageMaker 학습 작업</text>
  <text class="text box-body" x="845" y="205" text-anchor="middle">학습 파라미터, 손실, 처리량, 시스템 지표</text>
  <text class="text box-note" x="845" y="227" text-anchor="middle">상위 실행 ID로 파이프라인 기록과 연결</text>

  <path class="flow" d="M600 275 V307" marker-end="url(#arrow)"/>

  <rect class="client" x="230" y="318" width="740" height="82" rx="14"/>
  <text class="text box-title" x="600" y="350" text-anchor="middle">MLflow 클라이언트와 sagemaker-mlflow</text>
  <text class="text box-body" x="600" y="377" text-anchor="middle">App ARN, IAM 권한, SigV4 서명</text>

  <path class="flow" d="M600 400 V432" marker-end="url(#arrow)"/>

  <rect class="app" x="300" y="443" width="600" height="150" rx="16"/>
  <text class="text app-title" x="600" y="480" text-anchor="middle">SageMaker MLflow App</text>
  <text class="text box-body" x="600" y="506" text-anchor="middle">실험과 실행을 한곳에서 관리</text>

  <rect class="chip" x="340" y="532" width="120" height="34" rx="17"/>
  <text class="text chip-text" x="400" y="554" text-anchor="middle">상위 실행</text>

  <rect class="chip" x="473" y="532" width="120" height="34" rx="17"/>
  <text class="text chip-text" x="533" y="554" text-anchor="middle">학습 하위 실행</text>

  <rect class="chip" x="606" y="532" width="120" height="34" rx="17"/>
  <text class="text chip-text" x="666" y="554" text-anchor="middle">파라미터와 지표</text>

  <rect class="chip" x="739" y="532" width="120" height="34" rx="17"/>
  <text class="text chip-text" x="799" y="554" text-anchor="middle">태그와 상태</text>

  <path class="flow" d="M600 593 V625" marker-end="url(#arrow)"/>

  <rect class="panel" x="100" y="636" width="1000" height="164" rx="16"/>
  <text class="text section-label" x="128" y="666">저장 및 조회</text>

  <rect class="output" x="130" y="684" width="280" height="88" rx="12"/>
  <text class="text box-title" x="270" y="716" text-anchor="middle">MLflow UI</text>
  <text class="text box-body" x="270" y="743" text-anchor="middle">실험 검색, 실행 비교, 상세 조회</text>

  <rect class="output" x="460" y="684" width="280" height="88" rx="12"/>
  <text class="text box-title" x="600" y="716" text-anchor="middle">관리형 메타데이터</text>
  <text class="text box-body" x="600" y="743" text-anchor="middle">실행, 파라미터, 지표, 태그</text>

  <rect class="output" x="790" y="684" width="280" height="88" rx="12"/>
  <text class="text box-title" x="930" y="716" text-anchor="middle">사용자 S3 버킷</text>
  <text class="text box-body" x="930" y="743" text-anchor="middle">평가 결과, 리포트, 아티팩트</text>
</svg>
