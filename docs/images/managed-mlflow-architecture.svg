<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">SageMaker Managed MLflow architecture</title>
  <desc id="desc">Clients connect through the MLflow client and AWS plugin to managed MLflow resources, S3, Model Registry, and endpoints.</desc>
  <rect width="1200" height="790" fill="#0f1117"/>

  <text x="600" y="42" fill="#f8fafc" font-family="Courier New, monospace" font-size="20" font-weight="700" text-anchor="middle">SageMaker Managed MLflow architecture</text>
  <text x="600" y="66" fill="#94a3b8" font-family="Courier New, monospace" font-size="11" text-anchor="middle">Studio provides access; SageMaker AI manages the MLflow resource</text>

  <rect x="40" y="88" width="1120" height="130" rx="8" fill="#151923" stroke="#475569" stroke-width="1.5"/>
  <text x="62" y="112" fill="#94a3b8" font-family="Courier New, monospace" font-size="11" font-weight="700">WORK SURFACES AND CLIENTS</text>

  <rect x="70" y="130" width="300" height="64" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="155" fill="#93c5fd" font-family="Courier New, monospace" font-size="13" font-weight="700" text-anchor="middle">SageMaker AI Studio</text>
  <text x="220" y="176" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Create/manage App | Open MLflow UI</text>

  <rect x="450" y="130" width="300" height="64" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="155" fill="#93c5fd" font-family="Courier New, monospace" font-size="13" font-weight="700" text-anchor="middle">SageMaker Unified Studio</text>
  <text x="600" y="176" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Connect existing App | Project role</text>

  <rect x="830" y="130" width="300" height="64" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="980" y="155" fill="#93c5fd" font-family="Courier New, monospace" font-size="13" font-weight="700" text-anchor="middle">Local / Training / CI</text>
  <text x="980" y="176" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Notebook | Job | Pipeline | Application</text>

  <path d="M220 194 V248 H480" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M600 194 V248" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M980 194 V248 H720" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="350" y="248" width="500" height="88" rx="8" fill="#2d1b4e" stroke="#a78bfa" stroke-width="2"/>
  <text x="600" y="276" fill="#c4b5fd" font-family="Courier New, monospace" font-size="14" font-weight="700" text-anchor="middle">MLflow Python client + sagemaker-mlflow</text>
  <text x="600" y="299" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11" text-anchor="middle">Tracking URI = SageMaker MLflow ARN</text>
  <text x="600" y="319" fill="#94a3b8" font-family="Courier New, monospace" font-size="10" text-anchor="middle">boto3 credentials | IAM authorization | SigV4 signing</text>

  <rect x="150" y="382" width="900" height="220" rx="8" fill="#151923" stroke="#10b981" stroke-width="2"/>
  <text x="174" y="410" fill="#6ee7b7" font-family="Courier New, monospace" font-size="12" font-weight="700">SAGEMAKER AI MANAGED MLFLOW RESOURCES</text>

  <path d="M600 336 V424 H390 V442" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M600 336 V424 H810 V442" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <rect x="210" y="442" width="360" height="112" rx="8" fill="#0f2d1e" stroke="#10b981" stroke-width="2.5"/>
  <text x="390" y="470" fill="#6ee7b7" font-family="Courier New, monospace" font-size="15" font-weight="700" text-anchor="middle">MLflow App</text>
  <text x="390" y="493" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11" text-anchor="middle">Tracking server role | No size to pick | Auto update</text>
  <rect x="310" y="512" width="160" height="24" rx="5" fill="#064e3b" stroke="#34d399"/>
  <text x="390" y="528" fill="#a7f3d0" font-family="Courier New, monospace" font-size="10" font-weight="700" text-anchor="middle">RECOMMENDED</text>

  <rect x="630" y="442" width="360" height="112" rx="8" fill="#3b1f1f" stroke="#fb923c" stroke-width="2"/>
  <text x="810" y="470" fill="#fed7aa" font-family="Courier New, monospace" font-size="15" font-weight="700" text-anchor="middle">MLflow Tracking Server</text>
  <text x="810" y="493" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11" text-anchor="middle">Provisioned size | Start/stop | Legacy offering</text>
  <rect x="730" y="512" width="160" height="24" rx="5" fill="#431407" stroke="#fb923c"/>
  <text x="810" y="528" fill="#fed7aa" font-family="Courier New, monospace" font-size="10" font-weight="700" text-anchor="middle">EXISTING WORKLOADS</text>

  <text x="600" y="582" fill="#94a3b8" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Managed compute and backend metadata stay inside the SageMaker AI service boundary</text>

  <path d="M390 554 V632 H165 V650" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M390 554 V618 H455 V650" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M390 554 V606 H745 V650" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M810 554 V632 H165 V650" fill="none" stroke="#fb923c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <path d="M810 554 V618 H455 V650" fill="none" stroke="#fb923c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <path d="M810 554 V632 H780 V650" fill="none" stroke="#fb923c" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-orange)"/>

  <rect x="55" y="650" width="220" height="82" rx="8" fill="#1c2d20" stroke="#34d399" stroke-width="2"/>
  <text x="165" y="679" fill="#6ee7b7" font-family="Courier New, monospace" font-size="12" font-weight="700" text-anchor="middle">Managed metadata</text>
  <text x="165" y="700" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Experiments | Runs | Metrics</text>
  <text x="165" y="717" fill="#94a3b8" font-family="Courier New, monospace" font-size="9" text-anchor="middle">Operated by SageMaker AI</text>

  <rect x="345" y="650" width="220" height="82" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="455" y="679" fill="#e2e8f0" font-family="Courier New, monospace" font-size="12" font-weight="700" text-anchor="middle">Customer Amazon S3</text>
  <text x="455" y="700" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Models | Charts | Reports</text>
  <text x="455" y="717" fill="#94a3b8" font-family="Courier New, monospace" font-size="9" text-anchor="middle">Customer account and policies</text>

  <rect x="635" y="650" width="220" height="82" rx="8" fill="#2d1b4e" stroke="#a78bfa" stroke-width="2"/>
  <text x="745" y="679" fill="#c4b5fd" font-family="Courier New, monospace" font-size="12" font-weight="700" text-anchor="middle">Model Registry</text>
  <text x="745" y="700" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Opt-in model sync</text>
  <text x="745" y="717" fill="#94a3b8" font-family="Courier New, monospace" font-size="9" text-anchor="middle">Support varies by resource/version</text>

  <path d="M855 691 H925" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="925" y="650" width="220" height="82" rx="8" fill="#0f2d1e" stroke="#10b981" stroke-width="2"/>
  <text x="1035" y="679" fill="#6ee7b7" font-family="Courier New, monospace" font-size="12" font-weight="700" text-anchor="middle">SageMaker endpoint</text>
  <text x="1035" y="700" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">ModelBuilder / deployment</text>
  <text x="1035" y="717" fill="#94a3b8" font-family="Courier New, monospace" font-size="9" text-anchor="middle">Separate compute charges apply</text>

  <text x="600" y="766" fill="#64748b" font-family="Courier New, monospace" font-size="9" text-anchor="middle">Solid arrows show the main API and artifact flow.</text>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fb923c"/>
    </marker>
  </defs>
</svg>
