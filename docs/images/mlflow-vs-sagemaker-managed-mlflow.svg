<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">OSS MLflow compared with SageMaker Managed MLflow</title>
  <desc id="desc">OSS MLflow is self-managed. SageMaker Managed MLflow keeps the same API while AWS manages the server and metadata.</desc>
  <rect width="1200" height="820" fill="#0f1117"/>

  <text x="600" y="42" fill="#f8fafc" font-family="Courier New, monospace" font-size="20" font-weight="700" text-anchor="middle">OSS MLflow vs SageMaker Managed MLflow</text>
  <text x="600" y="66" fill="#94a3b8" font-family="Courier New, monospace" font-size="11" text-anchor="middle">The tracking concepts stay the same. Server ownership and AWS integration change.</text>

  <rect x="170" y="92" width="860" height="104" rx="8" fill="#1c2d20" stroke="#34d399" stroke-width="2"/>
  <text x="600" y="121" fill="#6ee7b7" font-family="Courier New, monospace" font-size="14" font-weight="700" text-anchor="middle">COMMON MLFLOW EXPERIENCE</text>
  <text x="600" y="149" fill="#f8fafc" font-family="Courier New, monospace" font-size="11" text-anchor="middle">Experiments | Runs | Parameters | Metrics | Artifacts | Models | Traces</text>
  <text x="600" y="174" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">start_run() | log_metric() | log_model() | MLflow UI</text>

  <path d="M490 196 V225 H300 V258" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M710 196 V225 H900 V258" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="40" y="232" width="520" height="470" rx="8" fill="#151923" stroke="#fb923c" stroke-width="2"/>
  <text x="300" y="265" fill="#fed7aa" font-family="Courier New, monospace" font-size="16" font-weight="700" text-anchor="middle">OSS MLflow</text>
  <text x="300" y="287" fill="#94a3b8" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Self-managed server stack</text>

  <rect x="80" y="315" width="440" height="66" rx="8" fill="#2d1b4e" stroke="#a78bfa" stroke-width="2"/>
  <text x="300" y="341" fill="#c4b5fd" font-family="Courier New, monospace" font-size="12" font-weight="700" text-anchor="middle">MLflow client</text>
  <text x="300" y="362" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">HTTP tracking URI | Auth configured by your team</text>

  <path d="M300 381 V415" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="80" y="415" width="440" height="84" rx="8" fill="#3b1f1f" stroke="#fb923c" stroke-width="2"/>
  <text x="300" y="444" fill="#fed7aa" font-family="Courier New, monospace" font-size="13" font-weight="700" text-anchor="middle">Your MLflow Tracking Server</text>
  <text x="300" y="468" fill="#e2e8f0" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Choose version | Plugins | Network | Authentication</text>
  <text x="300" y="486" fill="#94a3b8" font-family="Courier New, monospace" font-size="9" text-anchor="middle">Maximum control, maximum operational responsibility</text>

  <path d="M300 499 V526 H180 V544" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M300 499 V526 H420 V544" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <rect x="80" y="544" width="200" height="74" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="180" y="572" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11" font-weight="700" text-anchor="middle">Backend database</text>
  <text x="180" y="595" fill="#94a3b8" font-family="Courier New, monospace" font-size="9" text-anchor="middle">You select and operate it</text>

  <rect x="320" y="544" width="200" height="74" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="420" y="572" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11" font-weight="700" text-anchor="middle">Artifact storage</text>
  <text x="420" y="595" fill="#94a3b8" font-family="Courier New, monospace" font-size="9" text-anchor="middle">Local | S3 | Azure | GCS</text>

  <rect x="80" y="640" width="440" height="40" rx="7" fill="#431407" stroke="#fb923c"/>
  <text x="300" y="665" fill="#fed7aa" font-family="Courier New, monospace" font-size="10" font-weight="700" text-anchor="middle">YOU OPERATE: deploy | scale | TLS | backup | upgrade</text>

  <rect x="640" y="232" width="520" height="470" rx="8" fill="#151923" stroke="#3b82f6" stroke-width="2"/>
  <text x="900" y="265" fill="#93c5fd" font-family="Courier New, monospace" font-size="16" font-weight="700" text-anchor="middle">SageMaker Managed MLflow</text>
  <text x="900" y="287" fill="#94a3b8" font-family="Courier New, monospace" font-size="10" text-anchor="middle">SageMaker AI managed server stack</text>

  <rect x="680" y="315" width="440" height="66" rx="8" fill="#2d1b4e" stroke="#a78bfa" stroke-width="2"/>
  <text x="900" y="341" fill="#c4b5fd" font-family="Courier New, monospace" font-size="12" font-weight="700" text-anchor="middle">MLflow client + sagemaker-mlflow</text>
  <text x="900" y="362" fill="#cbd5e1" font-family="Courier New, monospace" font-size="10" text-anchor="middle">SageMaker ARN | AWS IAM | SigV4</text>

  <path d="M900 381 V415" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="680" y="415" width="440" height="84" rx="8" fill="#0f2d1e" stroke="#10b981" stroke-width="2.5"/>
  <text x="900" y="444" fill="#6ee7b7" font-family="Courier New, monospace" font-size="13" font-weight="700" text-anchor="middle">SageMaker MLflow App</text>
  <text x="900" y="468" fill="#e2e8f0" font-family="Courier New, monospace" font-size="10" text-anchor="middle">Tracking server role | Managed compute | Managed metadata</text>
  <text x="900" y="486" fill="#94a3b8" font-family="Courier New, monospace" font-size="9" text-anchor="middle">AWS controls the supported server configuration</text>

  <path d="M900 499 V526 H780 V544" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M900 499 V526 H1020 V544" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="680" y="544" width="200" height="74" rx="8" fill="#1c2d20" stroke="#34d399" stroke-width="2"/>
  <text x="780" y="572" fill="#6ee7b7" font-family="Courier New, monospace" font-size="11" font-weight="700" text-anchor="middle">Managed metadata</text>
  <text x="780" y="595" fill="#94a3b8" font-family="Courier New, monospace" font-size="9" text-anchor="middle">Operated by SageMaker AI</text>

  <rect x="920" y="544" width="200" height="74" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="1020" y="572" fill="#e2e8f0" font-family="Courier New, monospace" font-size="11" font-weight="700" text-anchor="middle">Customer Amazon S3</text>
  <text x="1020" y="595" fill="#94a3b8" font-family="Courier New, monospace" font-size="9" text-anchor="middle">Artifacts stay in your account</text>

  <rect x="680" y="640" width="440" height="40" rx="7" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="900" y="665" fill="#93c5fd" font-family="Courier New, monospace" font-size="10" font-weight="700" text-anchor="middle">AWS INTEGRATION: IAM | Model Registry | SageMaker workflows</text>

  <rect x="60" y="730" width="500" height="56" rx="8" fill="#3b1f1f" stroke="#fb923c" stroke-width="1.5"/>
  <text x="310" y="753" fill="#fed7aa" font-family="Courier New, monospace" font-size="11" font-weight="700" text-anchor="middle">Choose OSS when server control is the priority</text>
  <text x="310" y="772" fill="#94a3b8" font-family="Courier New, monospace" font-size="9" text-anchor="middle">Custom backend, plugins, identity, network, or multi-cloud</text>

  <rect x="640" y="730" width="500" height="56" rx="8" fill="#0f2d1e" stroke="#10b981" stroke-width="1.5"/>
  <text x="890" y="753" fill="#6ee7b7" font-family="Courier New, monospace" font-size="11" font-weight="700" text-anchor="middle">Choose Managed when reducing operations is the priority</text>
  <text x="890" y="772" fill="#94a3b8" font-family="Courier New, monospace" font-size="9" text-anchor="middle">AWS IAM, S3, Registry, training, and deployment integration</text>

  <text x="600" y="807" fill="#64748b" font-family="Courier New, monospace" font-size="9" text-anchor="middle">The experiment API stays the same; deployment and integration are managed.</text>

  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fb923c"/>
    </marker>
  </defs>
</svg>
