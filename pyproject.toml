[project]
name = "sagemaker-finetune-serve-e2e"
version = "0.1.0"
description = "End-to-end SageMaker fine-tuning and serving examples for Gemma SLMs"
requires-python = ">=3.10"
# 배포 패키지는 아니지만 코드와 문서의 라이선스를 명시합니다.
# 모델과 데이터셋 라이선스는 README의 라이선스 절을 따릅니다.
license = "MIT"
license-files = ["LICENSE"]

# 최소 버전은 `uv lock --upgrade`로 갱신할 수 있습니다.
dependencies = [
    # --- AWS / SageMaker ---
    "sagemaker>=3.16.0",       # 3.x = sagemaker-core 재구조화
    "boto3>=1.43.51",
    # common/config.py가 저장소 루트의 .env를 직접 읽습니다.
    "python-dotenv>=1.2.2",
    # 로컬 데이터 준비와 dry-run 학습
    "transformers==5.14.1",
    "datasets>=5.0.0",
    "huggingface_hub>=1.24.0",
    # --- 로컬 GPU dry-run 학습 (train.py) ---
    "trl>=1.8.0",
    "peft>=0.19.1",
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",    # QLoRA(4bit)용
    # --- 평가 (04_evaluate; common/eval_utils.py) ---
    "rouge-score>=0.1.2",      # 요약/QA ROUGE
    "scikit-learn>=1.5.0",     # 분류 accuracy/macro_f1
    "rapidfuzz>=3.9.0",        # 분류 라벨 퍼지 매칭(생성 라벨 정규화)
    # --- 부하 벤치마크 (pipelines/run_benchmark.py) ---
    # vllm bench serve와 같은 지표를 제공하는 도구를 사용합니다.
    # 리포를 고치면서 쓰려면 [tool.uv.sources] 로 로컬 경로를 가리킬 수 있다:
    #   sm-endpoint-bmt = { path = "../sm-endpoint-bmt", editable = true }
    "sm-endpoint-bmt>=1.0.0",
    # --- Agentic (Strands) ---
    "strands-agents>=1.48.0",
    "strands-agents-tools>=0.8.4",
    # --- 노트북 ---
    "jupyterlab",
    "ipywidgets",
]
# LiteLLM과 sagemaker의 importlib-metadata 요구 버전이 충돌하므로 선택 의존성으로 분리합니다.

[project.optional-dependencies]
# 로컬 vLLM 검증에만 설치합니다. SageMaker 배포에는 필요하지 않습니다.
local-serve = ["vllm>=0.19"]
# LiteLLM은 sagemaker와 분리된 환경에 설치하는 것을 권장합니다.
#     uv pip install -e '.[litellm]' --prerelease=allow
# strands-agents와 함께 해결 가능한 최소 버전을 사용합니다.
litellm = ["litellm>=1.75.9"]
# AgentCore Runtime 배포 시 (05 노트북 / agentcore/)
agentcore = ["bedrock-agentcore>=1.18.1"]
# LangGraph 옵션 (Strands 대안)
langgraph = ["langchain-aws>=1.6.2", "langgraph>=1.2.9"]
# Strands에서 LiteLLM 프로바이더를 사용할 때 설치합니다.
litellm-provider = ["strands-agents[litellm]>=1.48.0"]

[tool.uv]
# uv 전용 설정. 재현용 잠금은 uv.lock 로 관리.
# 업그레이드:  uv lock --upgrade                      (전체 최신으로)
#             uv lock --upgrade-package transformers  (특정 패키지만)
package = false   # 빌드 대상 패키지가 아닌 애플리케이션 저장소입니다.

[dependency-groups]
docs = [
    "mkdocs-material>=9.7.7",
]
